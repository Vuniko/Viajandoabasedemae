name: Storefront purchase smoke tests
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  storefront:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save playwright@1.56.1 @playwright/test@1.56.1
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Start static storefront
        run: python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/storefront-server.log 2>&1 &
      - name: Run simulated shopping flows
        run: npx playwright test tests/checkout.spec.cjs --reporter=line --workers=1
